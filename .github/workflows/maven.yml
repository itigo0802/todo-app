# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
    
name: Build Multi-Platform

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            profile: linux
            artifact_name: todo-app-linux
            file_extension: .tar.gz
          - os: windows-latest
            profile: windows
            artifact_name: todo-app-windows
            file_extension: .zip
          - os: macos-latest
            profile: mac
            artifact_name: todo-app-macos
            file_extension: .tar.gz

      runs-on: ${{ matrix.os }}

      steps:
        - uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven
          
        - name: Install Xvfb (Linux)
          if: matrix.os == 'ubuntu-latest'
          run: sudo apt-get update && sudo apt-get install -y xvfb

        - name: Build with Maven
          run: xvfb-run -a mvn clean package -P${{ matrix.profile }}
          working-directory: ./todo-app
          if: matrix.os == 'ubuntu-latest'
          
        - name: Build with Maven (Windows/mac)
          run: mvn clean package -P${{ matrix.profile }}
          working-directory: ./todo-app
          if: matrix.os != 'ubuntu-latest'

